<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novidades do catálogo - Agora Você Sabe</title>
    <link rel="icon" href="../icon.png" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="../design-system/assets/brand/simbolo-s-roxo-quadrado-laranja.svg" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#312783" />
    <link rel="preload" href="../design-system/assets/fonts/Quicksand-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="../design-system/styles.css" />
    <link rel="stylesheet" href="../tema.css" />
    <script src="../tema.js"></script>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="novidades.css" />
  </head>
  <body class="pagina-novidades">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="../" aria-label="CBS Médico Científica, voltar à busca">
          <img data-logo src="../design-system/assets/brand/logo-completo-gentequemove-roxo-quadrado-laranja.svg" alt="CBS · Gente que move o cuidado" width="160" />
        </a>
        <span class="site-header__label">Novidades</span>
        <a class="site-header__cotacao site-header__novidades" href="../novidades/" title="Novidades do catálogo: entraram, saíram e mudanças de preço" aria-current="page"><svg class="icone" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg><span class="site-header__cotacao-rotulo">Novidades</span></a>
        <a class="site-header__cotacao" id="linkCotacao" href="../cotacao/" title="Ver a lista de cotação"><svg class="icone" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg><span class="site-header__cotacao-rotulo">Cotação</span><span class="contador-cotacao" id="contadorCotacao" hidden>0</span></a>
        <div class="sino-wrap" id="sino">
          <button type="button" class="btn-sino" id="sinoBotao" aria-haspopup="true" aria-expanded="false" aria-controls="sinoPainel" aria-label="Novidades" title="Novidades"><svg class="icone" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="sino-contador" id="sinoContador" hidden>0</span></button>
          <div class="sino-painel" id="sinoPainel" role="region" aria-label="Novidades do Agora Você Sabe" tabindex="-1" hidden>
            <div class="sino-painel__topo"><strong>Novidades</strong><button type="button" class="sino-fechar" id="sinoFechar" aria-label="Fechar novidades"><svg class="icone" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
            <ul class="sino-lista" id="sinoLista"></ul>
          </div>
        </div>
        <a class="site-header__login" href="../"><svg class="icone" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>Voltar à busca</a>
        <button type="button" class="btn-tema" aria-label="Usar tema escuro" title="Tema escuro"><svg class="tema-lua" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="tema-sol" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
      </div>
    </header>

    <section class="faixa-busca">
      <div class="faixa-busca__fundo" aria-hidden="true">
        <img class="faixa-busca__grafismo" src="../design-system/assets/brand/grafismo-sorriso-roxo.svg" alt="" />
      </div>
      <div class="faixa-busca__conteudo">
        <div class="hero">
          <p class="eyebrow">Agora você sabe</p>
          <h1>Novidades do catálogo</h1>
          <p class="lead">
            O que <strong>entrou</strong>, o que <strong>saiu</strong> e quais <strong>preços mudaram</strong>.
            Escolha o período, filtre e clique no título de uma coluna para ordenar.
          </p>
        </div>
      </div>
    </section>

    <main class="page">
      <div class="nov-cards" role="tablist" aria-label="Tipo de novidade">
        <button type="button" class="nov-card" role="tab" id="aba-adicionados" data-aba="adicionados" aria-selected="true" aria-controls="novPainel">
          <span class="nov-card__icone nov-card__icone--add"><svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span>
          <span class="nov-card__texto"><span class="nov-card__n" id="nAdicionados">–</span><span class="nov-card__rotulo">Adicionados</span><span class="nov-card__sub" id="subAdicionados">no período</span></span>
        </button>
        <button type="button" class="nov-card" role="tab" id="aba-precos" data-aba="precos" aria-selected="false" aria-controls="novPainel">
          <span class="nov-card__icone nov-card__icone--preco"><svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg></span>
          <span class="nov-card__texto"><span class="nov-card__n" id="nPrecos">–</span><span class="nov-card__rotulo">Mudanças de preço</span><span class="nov-card__sub" id="subPrecos">da Lista Diária</span></span>
        </button>
        <button type="button" class="nov-card" role="tab" id="aba-removidos" data-aba="removidos" aria-selected="false" aria-controls="novPainel">
          <span class="nov-card__icone nov-card__icone--rem"><svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></span>
          <span class="nov-card__texto"><span class="nov-card__n" id="nRemovidos">–</span><span class="nov-card__rotulo">Removidos</span><span class="nov-card__sub" id="subRemovidos">no período</span></span>
        </button>
      </div>

      <div class="nov-filtros">
        <label class="nov-campo nov-campo--periodo" id="campoPeriodo">
          <span>Período</span>
          <select id="fPeriodo">
            <option value="7">Últimos 7 dias</option>
            <option value="30" selected>Últimos 30 dias</option>
            <option value="90">Últimos 90 dias</option>
            <option value="365">Último ano</option>
          </select>
        </label>
        <label class="nov-campo nov-campo--direcao" id="campoDirecao" hidden>
          <span>Variação</span>
          <select id="fDirecao">
            <option value="">Subiram e caíram</option>
            <option value="baixa">Só os que caíram</option>
            <option value="alta">Só os que subiram</option>
          </select>
        </label>
        <label class="nov-campo">
          <span>Categoria</span>
          <select id="fCategoria"><option value="">Todas</option></select>
        </label>
        <label class="nov-campo nov-campo--busca">
          <span>Filtrar</span>
          <input type="search" id="fTexto" placeholder="Código, descrição ou referência..." autocomplete="off" />
        </label>
      </div>

      <section id="novPainel" role="tabpanel" aria-labelledby="aba-adicionados">
        <p class="nov-info" id="novInfo" role="status" aria-live="polite">Carregando...</p>
        <div class="table-wrap nov-tabela-wrap" id="novTabelaWrap" hidden>
          <table class="nov-tabela">
            <thead id="novCabecalho"></thead>
            <tbody id="novCorpo"></tbody>
          </table>
        </div>
        <button type="button" class="btn-explorar nov-mais" id="novMais" hidden>Mostrar mais</button>
      </section>
    </main>

    <div class="aviso-cotacao" id="avisoCotacao" role="status" aria-live="polite" hidden></div>

    <script src="../config.js"></script>
    <script src="../api.js"></script>
    <script src="../sino.js"></script>
    <script src="../cotacao-store.js"></script>
    <script src="novidades.js"></script>
  </body>
</html>
